name: Yantr
options:
  bundleIdPrefix: com.projectbaseline
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "6"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSPrincipalClass: NSApplication
    PRODUCT_BUNDLE_IDENTIFIER: com.projectbaseline.Yantr
    ENABLE_HARDENED_RUNTIME: YES
    SUPPORTS_MACCATALYST: NO

targets:
  YantrCore:
    type: framework
    platform: macOS
    sources:
      - path: BaselineBar
        excludes:
          - App/BaselineBarApp.swift
          - Assets.xcassets
          - BaselineBar.entitlements
          - Views
    settings:
      base:
        PRODUCT_NAME: YantrCore
        PRODUCT_BUNDLE_IDENTIFIER: com.projectbaseline.YantrCore
        SKIP_INSTALL: NO
        MACH_O_TYPE: staticlib

  Yantr:
    type: application
    platform: macOS
    sources:
      - path: BaselineBar
    settings:
      base:
        PRODUCT_NAME: Yantr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: YantrCore
    entitlements:
      path: BaselineBar/BaselineBar.entitlements
    scheme:
      testTargets:
        - YantrTests

  YantrTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        TEST_HOST: ""
    sources:
      - path: Tests
    dependencies:
      - target: YantrCore
